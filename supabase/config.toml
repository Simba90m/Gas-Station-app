# Supabase CLI project configuration. See:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "gas-station-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
# Applied in filename order — see supabase/seed/ for what each file does.
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "exp://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# OTP/magic-link email delivery isn't configured yet — Phase 2 seeds demo
# accounts directly instead of through real signup. Revisit when the
# customer/employee apps build real registration screens.
enable_confirmations = false

[storage]
enabled = true
