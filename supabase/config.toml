# Supabase CLI project configuration. See:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "gas-station-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
# Applied in filename order — see supabase/seed/ for what each file does.
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "exp://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Required for the public join flow's email-OTP step (customer verification
# — see supabase/migrations/20240101000270_customer_dual_channel_verification.sql).
# Was false — Phase 2 seeded demo accounts directly instead of through real
# signup, so this was never exercised until now.
enable_confirmations = true

# Phone OTP — the public /join/[token] flow's first verification step.
# Requires a real SMS vendor; local/CI testing uses auth.sms.test_otp below
# instead of sending real SMS. The equivalent for a hosted project is
# Dashboard -> Authentication -> Providers -> Phone, with the same Twilio
# credentials (this file only configures the local CLI stack).
[auth.sms]
enable_signup = true
enable_confirmations = true
provider = "twilio"

[auth.sms.twilio]
account_sid = "env(TWILIO_ACCOUNT_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"

# Local/CI only — lets the OTP flow be exercised end-to-end without a real
# Twilio account or SMS spend. Fixed test numbers map to fixed codes; add
# more pairs here as needed for testing. Has no effect on a hosted project.
[auth.sms.test_otp]
"+201000000001" = "123456"

[storage]
enabled = true
