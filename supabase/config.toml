# Supabase CLI project configuration. See:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "gas-station-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
# Applied in filename order — see supabase/seed/ for what each file does.
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "exp://localhost:8081"]
jwt_expiry = 3600
enable_signup = true
# Lets the customer mobile app (apps/mobile) call
# supabase.auth.signInAnonymously() to get a real session — auth.uid() is a
# genuine (as-yet-unverified) customer row, so the EXISTING
# owns_customer_row()-gated join_queue()/create_booking() RLS checks pass
# unchanged. No new RPC, no RLS relaxation, no bypass: this is the same
# authorization path every other authenticated caller already uses,
# nothing new for auth.uid() to mean. Scoped narrowly to the mobile app's
# Start Now / Book for Later actions, which call this right before
# submitting if no session exists yet — never on app boot, never for the
# admin dashboard. Anonymous sessions are Supabase's own standard,
# supported mechanism for exactly this "let someone act before they've
# proven who they are" case, and are designed to be upgraded in place
# later (supabase.auth.updateUser()) once phone/email OTP verification is
# wired up for the mobile app too — see
# supabase/migrations/20240101000270_customer_dual_channel_verification.sql
# for the same signInWithOtp/verifyOtp/updateUser sequence the admin app's
# public join flow already uses, which will apply here unchanged.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# Required for the public join flow's email-OTP step (customer verification
# — see supabase/migrations/20240101000270_customer_dual_channel_verification.sql).
# Was false — Phase 2 seeded demo accounts directly instead of through real
# signup, so this was never exercised until now.
enable_confirmations = true

# Phone OTP — the public /join/[token] flow's first verification step.
# Requires a real SMS vendor; local/CI testing uses auth.sms.test_otp below
# instead of sending real SMS. The equivalent for a hosted project is
# Dashboard -> Authentication -> Providers -> Phone, with the same Twilio
# credentials (this file only configures the local CLI stack).
[auth.sms]
enable_signup = true
enable_confirmations = true
provider = "twilio"

[auth.sms.twilio]
account_sid = "env(TWILIO_ACCOUNT_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"

# Local/CI only — lets the OTP flow be exercised end-to-end without a real
# Twilio account or SMS spend. Fixed test numbers map to fixed codes; add
# more pairs here as needed for testing. Has no effect on a hosted project.
[auth.sms.test_otp]
"+201000000001" = "123456"

[storage]
enabled = true
